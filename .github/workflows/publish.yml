name: Publish

# Every push to main runs the tests. When package.json carries a version that is not published yet,
# the push also publishes it, so a release is: bump the version, push.
# - npm, as agent-sitemap, through npm trusted publishing: no token, but the package's Trusted
#   Publisher on npmjs.com must name Deckard-LLC / agent-sitemap / publish.yml.
# - GitHub Packages, as @deckard-llc/agent-sitemap, which lists it on the repository page.
# A version that is already published is skipped, so pushes without a version bump publish nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  npm:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing: npm checks this workflow's identity instead of a token
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "agent-sitemap@$version" version >/dev/null 2>&1; then
            echo "agent-sitemap@$version is already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: npm publish

  github-packages:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@deckard-llc"
          cache: pnpm
      # GitHub Packages takes only names scoped to the owner of the repository.
      - run: npm pkg set name=@deckard-llc/agent-sitemap
      - id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@deckard-llc/agent-sitemap@$version" version >/dev/null 2>&1; then
            echo "@deckard-llc/agent-sitemap@$version is already on GitHub Packages"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
