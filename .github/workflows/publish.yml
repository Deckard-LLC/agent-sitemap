name: Publish

# A GitHub release publishes the version in package.json:
# - to npm as agent-sitemap, through npm trusted publishing (no token; configure the package's
#   Trusted Publisher on npmjs.com: Laplace-LLC / agent-sitemap / publish.yml);
# - to GitHub Packages as @laplace-llc/agent-sitemap, which lists it on the repository page.
# Run it by hand to publish the current version to GitHub Packages only.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  npm:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing: npm checks this workflow's identity instead of a token
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm publish

  github-packages:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@laplace-llc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub Packages takes only names scoped to the owner of the repository.
      - run: npm pkg set name=@laplace-llc/agent-sitemap
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
